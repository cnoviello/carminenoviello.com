{{- $book := .Site.Params.book -}}
{{- with $book -}}
<section class="section" aria-labelledby="book-promo-title">
  <div class="container">
    <aside class="featured__card">
      <div class="featured__text">
        <div class="featured__tag">{{ .eyebrow }}</div>
        <h2 class="featured__title" id="book-promo-title">{{ .title }}</h2>
        <p class="featured__excerpt">{{ .description }}</p>
        <a class="featured__more" href="{{ .url | relURL }}">{{ .cta }} →</a>
      </div>
      {{ with .image }}
        {{ with resources.Get . }}
        <a class="featured__image" href="{{ $book.url | relURL }}" style="display:grid;place-items:center;background:#e9dfd0">
          <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $book.alt }}" style="width:auto;height:100%;max-width:100%;max-height:24rem;object-fit:contain;padding:1.5rem">
        </a>
        {{ end }}
      {{ end }}
    </aside>
  </div>
</section>
{{- end -}}
